# SPA fallback: serve index.html for any route not matching a
# static file or Netlify function. Without this, direct navigation
# to /cards, etc. (or PWA relaunch) returns a 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"

